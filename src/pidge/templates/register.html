{% extends "layout.html" %}
{% block title %}Register — Pidge{% end %}
{% block page_content %}
<div class="page-head">
  <div>
    <p class="kicker">Same loft</p>
    <h1>Join this loft</h1>
  </div>
</div>
{% if error %}<p class="hint" style="color:#8b3a2a">{{ error }}</p>{% end %}
<form method="post" action="/register" class="compose-panel">
  {{ csrf_field() }}
  <label>Username <input name="username" value="{{ values.username }}" required></label>
  <label>Display name <input name="display_name" value="{{ values.display_name }}"></label>
  <label>Password <input name="password" type="password" required minlength="10"></label>
  <button class="btn btn-seal" type="submit">Join</button>
</form>
{% end %}
