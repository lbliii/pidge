{% extends "layout.html" %}
{% block title %}Log in — Pidge{% end %}
{% block page_content %}
<div class="page-head">
  <div>
    <p class="kicker">Secretary desk</p>
    <h1>Log in</h1>
  </div>
</div>
{% if error %}<p class="hint" style="color:#8b3a2a">{{ error }}</p>{% end %}
<form method="post" action="/login" class="compose-panel">
  {{ csrf_field() }}
  <label>Username <input name="username" required></label>
  <label>Password <input name="password" type="password" required></label>
  <button class="btn btn-seal" type="submit">Enter</button>
</form>
<p class="hint"><a href="/register">Register another loft member</a></p>
{% end %}
