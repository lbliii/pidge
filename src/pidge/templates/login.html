{% extends "layout.html" %}
{% block title %}Log in — Pidge{% end %}
{% block page_content %}
<div class="page-head">
  <div>
    <p class="kicker">Secretary desk</p>
    <h1>Log in</h1>
  </div>
</div>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% end %}
<form method="post" action="/login" class="compose-panel">
  {{ csrf_field() }}
  <div class="field">
    <label for="username">Username</label>
    <input id="username" name="username" required autocomplete="username">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
  </div>
  <button class="btn btn-seal" type="submit">Enter</button>
</form>
<p class="hint"><a href="/register">Register another loft member</a></p>
<p class="hint"><a href="/connect">Connecting an agent?</a> · <a href="/llms.txt">llms.txt</a></p>
{% end %}
