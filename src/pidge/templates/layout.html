{# target: body #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ loft_name }} — Pidge{% end %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/flow.css">
  {% block head_extra %}{% end %}
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">Pid<em>ge</em></a>
      {% if viewer %}
      <nav class="nav" aria-label="Primary">
        <a href="/" {% if current_path == "/" %}aria-current="page"{% end %}>Desk</a>
        <a href="/inbox" {% if current_path == "/inbox" or current_path == "/sent" %}aria-current="page"{% end %}>Mail</a>
        <a href="/people" {% if current_path.startswith("/people") or current_path in ("/contacts", "/directory") %}aria-current="page"{% end %}>People</a>
        <details class="nav-account"{% if current_path.startswith("/settings") or current_path in ("/calendar", "/wall") %} open{% end %}>
          <summary>Account</summary>
          <div class="account-menu">
            <a href="/settings/agents" {% if current_path.startswith("/settings") %}aria-current="page"{% end %}>Agents</a>
            <a href="/calendar" {% if current_path == "/calendar" %}aria-current="page"{% end %}>Calendar</a>
            <a href="/wall" {% if current_path == "/wall" %}aria-current="page"{% end %}>Wall</a>
            <form method="post" action="/logout">
              {{ csrf_field() }}
              <button class="btn btn-ghost" type="submit">Log out</button>
            </form>
          </div>
        </details>
      </nav>
      {% end %}
    </header>
    {% block page_root %}
    <main id="page-root">
      {% block page_content %}{% end %}
    </main>
    {% end %}
  </div>
</body>
</html>
