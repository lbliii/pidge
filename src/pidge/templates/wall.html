{% extends "layout.html" %}
{% block title %}Wall — Pidge{% end %}
{% block page_content %}
<div class="page-head">
  <div>
    <p class="kicker">Personal loft</p>
    <h1>Wall of notes</h1>
  </div>
</div>
{% if pins %}
<ul>
  {% for p in pins %}
  <li><a href="/p/{{ p.pidge_id }}">{{ p.title }}</a></li>
  {% end %}
</ul>
{% else %}
<p class="hint">Pin sealed Pidges from a thread.</p>
{% end %}
{% end %}
