<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compose — Pidge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="flow.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  </head>
  <body>
    <div
      class="shell"
      x-data="{
        step: 'waiting',
        intent: 'Tell Lucy we’re meeting tonight at 7 at Nowadays',
        blocksReady: false,
        menuFailed: false,
        ride: [
          { id: 'who', label: 'Resolve Lucy', detail: 'contact match', state: 'pending' },
          { id: 'when', label: 'Parse time', detail: 'tonight · 7:00 PM', state: 'pending' },
          { id: 'where', label: 'Find Nowadays', detail: 'place · Brooklyn', state: 'pending' },
          { id: 'map', label: 'Fetch map', detail: 'lat/lng', state: 'pending' },
          { id: 'menu', label: 'Fetch menu', detail: 'kitchen + wine', state: 'pending' },
          { id: 'reviews', label: 'Fetch reviews', detail: 'places', state: 'pending' }
        ],
        slots: {
          who: { status: 'pending', value: null },
          when: { status: 'pending', value: null },
          where: { status: 'pending', value: null }
        },
        receiveDraft() {
          if (this.step !== 'waiting') return;
          this.step = 'enriching';
          this.blocksReady = false;
          this.menuFailed = false;
          this.ride.forEach((r) => (r.state = 'pending'));
          Object.keys(this.slots).forEach((k) => {
            this.slots[k] = { status: 'pending', value: null };
          });
          const values = {
            who: 'Lucy',
            when: 'Tonight · 7:00 PM',
            where: 'Nowadays, Brooklyn'
          };
          const run = (i) => {
            if (i >= this.ride.length) {
              this.blocksReady = true;
              this.menuFailed = true;
              this.step = 'ready';
              return;
            }
            this.ride[i].state = 'active';
            setTimeout(() => {
              const item = this.ride[i];
              if (item.id === 'menu') {
                item.state = 'done';
                item.detail = 'skipped · source down';
              } else {
                item.state = 'done';
              }
              const key = ['who', 'when', 'where'].includes(item.id) ? item.id : null;
              if (key && this.slots[key]) {
                this.slots[key] = { status: 'ready', value: values[key] };
              }
              if (item.id === 'where') {
                this.blocksReady = true;
              }
              run(i + 1);
            }, 480);
          };
          run(0);
        }
      }"
    >
      <header class="topbar">
        <a class="brand" href="index.html">Pid<em>ge</em></a>
        <nav class="nav" aria-label="Primary">
          <a href="desk.html">Desk</a>
          <a href="inbox.html">Mail</a>
          <a href="#people">People</a>
          <details class="nav-account">
            <summary>Account</summary>
            <div class="account-menu">
              <a href="agents.html">Agents</a>
              <a href="stamps.html">Stamps</a>
              <a href="system.html">System kit</a>
              <a href="login.html">Log out</a>
            </div>
          </details>
        </nav>
      </header>

      <div class="page-head">
        <div>
          <p class="kicker">Draft → enrich → seal</p>
          <h1>Compose</h1>
        </div>
      </div>

      <div class="steps-rail" aria-label="Compose progress">
        <span class="step-chip" :class="step === 'waiting' ? 'is-active' : 'is-done'">1 Draft</span>
        <span class="step-chip" :class="step === 'enriching' ? 'is-active' : (step === 'ready' ? 'is-done' : '')">2 Enrich</span>
        <span class="step-chip" :class="step === 'ready' ? 'is-active' : ''">3 Seal</span>
      </div>

      <div class="thread-layout">
        <div class="compose-panel">
          <template x-if="step === 'waiting'">
            <div>
              <p class="lede" style="margin-top:0">
                No free-type box. Your agent calls <code>draft_pidge</code> /
                <code>enrich_pidge</code> on MCP; this desk watches enriching
                and seals.
              </p>
              <p class="hint">Demo: simulate an inbound draft from the secretary agent.</p>
              <div class="actions" style="margin-top: 1rem">
                <button type="button" class="btn btn-seal" @click="receiveDraft()">
                  Simulate agent draft
                </button>
              </div>
            </div>
          </template>

          <template x-if="step !== 'waiting'">
            <div>
              <div class="kind-row">
                <span class="badge invite">Invite · draft</span>
                <span class="badge enriching" x-show="step === 'enriching'" x-cloak>Enriching</span>
                <span class="badge ready" x-show="step === 'ready'" x-cloak>Ready to seal</span>
              </div>
              <p class="hint">Intent (from agent)</p>
              <p><strong x-text="intent"></strong></p>

              <p class="hint">Slots</p>
              <ul class="slot-list">
                <template x-for="key in ['who', 'when', 'where']" :key="key">
                  <li class="slot-row" :class="'is-' + slots[key].status">
                    <code x-text="key"></code>
                    <span class="slot-status" x-text="slots[key].status"></span>
                    <span class="mono" x-text="slots[key].value || 'waiting'"></span>
                  </li>
                </template>
              </ul>

              <p class="hint">Enrich preview</p>
              <div class="enrich-stack" :class="!blocksReady ? 'is-skel' : ''">
                <div class="place-hero" :class="blocksReady ? 'has-art' : 'is-mono'">
                  <span class="mono-mark" x-show="!blocksReady" aria-hidden="true">N</span>
                  <h3 x-text="blocksReady ? 'Nowadays' : '…'"></h3>
                  <p x-text="blocksReady ? 'Bushwick · kitchen + natural wine' : 'Resolving place…'"></p>
                  <p class="hero-meta" x-show="blocksReady" x-cloak>place · fetching blocks</p>
                </div>
                <div class="fact-strip" x-show="blocksReady" x-cloak>
                  <div class="fact">
                    <span class="fact-label">Who</span>
                    <span class="fact-value" x-text="slots.who.value || '…'"></span>
                  </div>
                  <div class="fact">
                    <span class="fact-label">When</span>
                    <span class="fact-value" x-text="slots.when.value || '…'"></span>
                  </div>
                  <div class="fact">
                    <span class="fact-label">Where</span>
                    <span class="fact-value">Nowadays</span>
                  </div>
                </div>
                <div class="map-block">
                  <p class="block-label">Map</p>
                  <template x-if="blocksReady">
                    <div>
                      <div class="map-pin" aria-hidden="true"></div>
                      <strong>56 Bogart St, Brooklyn</strong>
                      <p class="mono">40.706 · -73.923</p>
                    </div>
                  </template>
                  <template x-if="!blocksReady">
                    <p class="mono">…</p>
                  </template>
                </div>
                <div class="block-degraded" x-show="menuFailed" x-cloak>
                  <p class="block-label">Menu</p>
                  <p>Couldn’t fetch menu — seal still OK. Slots gate seal; blocks do not.</p>
                  <p class="mono">skipped · source down</p>
                </div>
                <div class="menu-block" x-show="!menuFailed && step === 'enriching'" x-cloak>
                  <p class="block-label">Menu</p>
                  <p class="mono">fetching…</p>
                </div>
                <div class="reviews-block">
                  <p class="block-label">Reviews</p>
                  <template x-if="step === 'ready'">
                    <div>
                      <div class="stars" aria-label="4.6 stars">★★★★☆</div>
                      <strong>4.6 · “Best patio in Bushwick”</strong>
                    </div>
                  </template>
                  <template x-if="step !== 'ready'">
                    <p class="mono">…</p>
                  </template>
                </div>
              </div>

              <p class="hint seal-blocked" x-show="step === 'enriching'" x-cloak>
                Seal blocked — waiting on who, when, where via enrich_pidge.
              </p>
              <p class="hint seal-ready" x-show="step === 'ready'" x-cloak>
                Slots ready — seal to send. Optional menu block degraded; still sealable.
              </p>
              <div class="actions" style="margin-top: 1rem">
                <button type="button" class="btn btn-seal" disabled x-show="step === 'enriching'" x-cloak>
                  Seal
                </button>
                <a class="btn btn-seal" href="sent.html" x-show="step === 'ready'" x-cloak>
                  Seal &amp; send to Lucy
                </a>
              </div>
            </div>
          </template>
        </div>

        <aside class="flight-rail">
          <h2>Enriching</h2>
          <template x-if="step === 'waiting'">
            <p class="hint">Waiting on agent inbound…</p>
          </template>
          <template x-if="step === 'enriching'">
            <div>
              <p class="hint">State: enriching</p>
              <div class="flight-track" aria-hidden="true"><span></span></div>
            </div>
          </template>
          <template x-if="step === 'ready'">
            <p class="hint">State: enriched · ready to seal</p>
          </template>
          <ul class="ride-log" x-show="step !== 'waiting'" x-cloak>
            <template x-for="item in ride" :key="item.id">
              <li :class="'is-' + item.state">
                <span class="ride-dot" aria-hidden="true"></span>
                <span x-text="item.label"></span>
                <span class="mono" x-text="item.state === 'done' ? (item.id === 'menu' ? 'skip' : 'ok') : item.detail"></span>
              </li>
            </template>
          </ul>
        </aside>
      </div>

      <footer class="footer">
        <span>Mock · compose flow</span>
        <span>Draft → Enrich → Seal</span>
      </footer>
    </div>
    <style>
      [x-cloak] {
        display: none !important;
      }
      .flight-rail h2 {
        font-family: var(--font-display);
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 0 0 0.5rem;
      }
    </style>
  </body>
</html>
