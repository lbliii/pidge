<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — Pidge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="index.html">Pid<em>ge</em></a>
        <nav class="nav" aria-label="Primary">
          <a href="login.html" aria-current="page">Enter</a>
        </nav>
      </header>

      <main class="hero" style="min-height: calc(100vh - 8rem)">
        <div class="floating-seal" aria-hidden="true"></div>
        <p class="kicker">Secretary desk</p>
        <h1>Enter the <span>loft</span>.</h1>
        <p class="hero-lead">
          One deployment, one loft. Your agent writes via MCP. You review, seal,
          and act.
        </p>

        <form class="compose-panel" style="max-width: 24rem" action="desk.html" method="get">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" value="you" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" value="••••••••" autocomplete="current-password" required />
          </div>
          <div class="actions" style="margin-top: 0.25rem">
            <button class="btn btn-seal" type="submit">Enter</button>
            <a class="btn btn-ghost" href="desk.html">Skip to desk</a>
          </div>
        </form>
        <p class="hint" style="margin-top: 1rem">
          New here? Register another loft member after setup.
        </p>
      </main>

      <footer class="footer">
        <span>Mock · enter the loft</span>
        <a href="agents.html">Next: mint an agent</a>
      </footer>
    </div>
  </body>
</html>
